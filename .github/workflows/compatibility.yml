name: Zola compatibility

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZOLA_VERSION: "0.23.4"
      # Published release asset digest from the official getzola/zola API:
      # https://api.github.com/repos/getzola/zola/releases/tags/v0.23.4
      ZOLA_SHA256: "54d1a347781b2f32330914fcc02def81c7e3ddb6111b36d1cc89c06557aed1de"
    steps:
      - name: Check out the branch or pull request
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install checksum-verified Zola in runner temp
        shell: bash
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/zola-${ZOLA_VERSION}"
          mkdir -p "$install_dir"
          archive="${install_dir}/zola.tar.gz"
          curl --fail --show-error --silent --location --retry 3 \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ZOLA_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" zola
          "$install_dir/zola" --version
          printf '%s\n' "$install_dir" >> "$GITHUB_PATH"
      - name: Run real consumer-site regression tests
        shell: bash
        run: python3 -m unittest discover -s tests -v
      - name: Build repository demo into fresh temporary output
        shell: bash
        run: zola build --output-dir "${RUNNER_TEMP}/archie-zola-demo-public"
